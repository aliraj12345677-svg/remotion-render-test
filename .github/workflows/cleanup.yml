name: Cleanup old jobs
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq ".[] | select(.tagName|startswith(\"job-\")) | select(.createdAt < \"$CUTOFF\") | .tagName" |
          while read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true; done
          gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name | select(startswith("job/"))' |
          while read -r br; do
            d=$(gh api "repos/$GITHUB_REPOSITORY/commits/$br" --jq '.commit.committer.date')
            if [ "$d" \< "$CUTOFF" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$br" || true; fi
          done
