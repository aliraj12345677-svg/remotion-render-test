name: Render job
on:
  push:
    branches: ["job/**"]

permissions: {}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Typecheck and render (generated code runs ONLY in this read-only job)
        run: |
          mkdir -p result
          if ! npx tsc --noEmit > result/tsc.log 2>&1; then
            { echo "TypeScript errors:"; head -c 6000 result/tsc.log; } > result/error.txt
          elif ! npx remotion render src/index.ts Main result/video.mp4 > result/render.log 2>&1; then
            { echo "Render failed:"; tail -c 6000 result/render.log; } > result/error.txt
          fi
          rm -f result/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: result/
          retention-days: 1

  publish:
    needs: render
    if: ${{ !cancelled() && needs.render.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: result
          path: result
      - name: Publish release (tag = job-<id>-<sha7>)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID="${GITHUB_REF_NAME#job/}"
          TAG="job-${ID}-${GITHUB_SHA::7}"
          gh release create "$TAG" result/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "automated render result"
